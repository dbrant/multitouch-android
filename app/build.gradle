apply plugin: 'com.android.application'

android {
    compileSdk = 37

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.dmitrybrant.android.multitouch"
        minSdk = 8
        targetSdk = 37
        versionCode = 17
        versionName = "1.16"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    namespace 'com.dmitrybrant.android.multitouch'
}

dependencies {
}
